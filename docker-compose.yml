services:
  dokploy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dokploy
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://dokploy:${POSTGRES_PASSWORD:-changeme}@dokploy-postgres:5432/dokploy
      REDIS_HOST: dokploy-redis
      API_KEY: ${API_KEY:-changeme}
      SERVER_URL: http://dokploy-api:4000
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-changeme}
      POSTGRES_WAIT_TIMEOUT: 120000
      POSTGRES_WAIT_RETRY: 2000
    volumes:
      - dokploy_data:/etc/dokploy
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      dokploy-postgres:
        condition: service_healthy
      dokploy-redis:
        condition: service_started
      dokploy-api:
        condition: service_started
      dokploy-schedules:
        condition: service_started
      dokploy-monitoring:
        condition: service_started

  dokploy-postgres:
    image: postgres:16-alpine
    container_name: dokploy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dokploy
      POSTGRES_USER: dokploy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - dokploy_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dokploy -d dokploy"]
      interval: 5s
      timeout: 3s
      retries: 20

  dokploy-redis:
    image: redis:7-alpine
    container_name: dokploy-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - dokploy_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  dokploy-api:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: dokploy-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      API_KEY: ${API_KEY:-changeme}
      INNGEST_BASE_URL: ${INNGEST_BASE_URL:-}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:-}
    depends_on:
      dokploy-postgres:
        condition: service_healthy
      dokploy-redis:
        condition: service_started

  dokploy-schedules:
    build:
      context: .
      dockerfile: Dockerfile.schedule
    container_name: dokploy-schedules
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4001
      API_KEY: ${API_KEY:-changeme}
      REDIS_URL: redis://dokploy-redis:6379
    depends_on:
      dokploy-redis:
        condition: service_started

  dokploy-monitoring:
    build:
      context: .
      dockerfile: Dockerfile.monitoring
    container_name: dokploy-monitoring
    restart: unless-stopped
    environment:
      METRICS_CONFIG: |
        {"server":{"refreshRate":25,"port":3001,"type":"Dokploy","token":"metrics","urlCallback":"http://dokploy:3000/api/trpc/notification.receiveNotification","retentionDays":7,"cronJob":"0 0 * * *","thresholds":{"cpu":0,"memory":0}},"containers":{"refreshRate":25,"services":{"include":[],"exclude":[]}}}
    ports:
      - "3001:3001"
    volumes:
      - dokploy_monitoring_data:/app
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  dokploy_data:
  dokploy_postgres_data:
  dokploy_redis_data:
  dokploy_monitoring_data:
